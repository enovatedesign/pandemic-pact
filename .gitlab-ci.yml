default:
    image: gitlab.enovate.co.uk:5050/docker-images/php-ci:php8.2-node${NODE_VERSION}

stages:
    - test
    - build
    - deploy
    - verify

# Lint and unit tests. Gates every deploy job below: a failure here means the
# deploy stage never runs and no Vercel hook is fired.
#
# Deliberately `next lint` rather than `npm run lint`: the latter also runs a
# whole-app `tsc`, and the app statically imports generated JSON (data/dist,
# public/data) that only exists after `npm run generate` — which this job does
# not run, and should not. That typecheck is not skipped, just moved: Vercel's
# `next build` runs it with the data present and ignoreBuildErrors set to false.
# `npm test` compiles tsconfig-scripts, which needs no generated data.
unit_tests:
    stage: test
    before_script:
        - npm ci --cache .npm --prefer-offline
    script:
        - npx next lint
        - npm test
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
          when: never
        - when: on_success

# Post-deploy checks against the live deployment. These cannot gate the deploy —
# develop/master deploy via an async Vercel hook — but they fail the pipeline,
# which is the alert. They cost the deployment itself nothing.
.smoke:
    stage: verify
    # Must match @playwright/test exactly, which is pinned without a caret in
    # package.json for that reason — the image ships only its own browser build.
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    before_script:
        - npm ci --cache .npm --prefer-offline
    script:
        - npm run test:smoke
        - npm run test:e2e
    artifacts:
        when: always
        paths:
            - playwright-report/
            - test-results/
        expire_in: 1 week

fetch_pubmed_data:
    stage: build
    before_script:
        - npm ci --cache .npm --prefer-offline 
    script:
        - npm run fetch-pubmed-data
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "master"
    retry: 2

deploy_review:
    stage: deploy
    except:
        - develop
        - master
    variables:
        # Feature branches index into their own <branch>-grants-v2 (getIndexName
        # normalises this); the S3 prefix derives from CI_COMMIT_REF_NAME the same way.
        SEARCH_INDEX_PREFIX_OVERRIDE: $CI_COMMIT_REF_NAME
    before_script:
        - npm ci --cache .npm --prefer-offline
    script:
        - vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
        - |
            set -e
            # Run the heavy generate on the GitLab runner (only when the grants data
            # changed) so the `vercel deploy` below takes the fast cached path instead
            # of regenerating on Vercel. Mirrors .deploy_decoupled's generate gate.
            npx tsc --project tsconfig-scripts.json
            if node ./compiled-scripts/scripts/check-grants-freshness.js; then
                echo "Grants data changed — running full generate on GitLab for $CI_COMMIT_REF_NAME"
                SEARCH_INDEX_PREFIX="$SEARCH_INDEX_PREFIX_OVERRIDE" FORCE_UPLOAD=true npm run generate
            else
                echo "Grants data unchanged — skipping generate; Vercel deploy takes the cached path"
            fi
        - |
            # vercel prints ONLY the deployment URL to stdout; progress and the
            # trailing "To deploy to production…" hint go to stderr. Capture stdout
            # only — the old `2>&1 | tail -1` grabbed that hint instead of the URL,
            # which then made `vercel alias set` fail and marked the whole job failed
            # even though the deploy itself succeeded.
            DEPLOYMENT_URL=$(vercel deploy \
              --build-env "SEARCH_INDEX_PREFIX=$CI_COMMIT_REF_NAME" \
              --build-env "CI_COMMIT_REF_NAME=$CI_COMMIT_REF_NAME" \
              --token=$VERCEL_TOKEN)

            echo "Deployed to: $DEPLOYMENT_URL"

            # A genuine deploy failure (no URL) should still fail the job.
            case "$DEPLOYMENT_URL" in
                https://*) ;;
                *) echo "Deploy did not return a URL — failing."; exit 1 ;;
            esac

            # The friendly per-branch alias is a convenience only; never let it fail
            # the job. Fall back to the unique deployment URL for the environment link.
            ALIAS="${CI_COMMIT_REF_SLUG}.${CI_PROJECT_NAME}.vercel.app"
            if vercel alias set "$DEPLOYMENT_URL" "$ALIAS" --scope=enovatedesign --token=$VERCEL_TOKEN; then
                ENVIRONMENT_URL="https://${ALIAS}"
            else
                echo "Alias step failed; using the deployment URL for the environment link."
                ENVIRONMENT_URL="$DEPLOYMENT_URL"
            fi

            echo "DYNAMIC_ENVIRONMENT_URL=${ENVIRONMENT_URL}" > deploy.env
    artifacts:
        reports:
            dotenv: deploy.env
    environment:
        name: review/$CI_COMMIT_REF_NAME
        url: $DYNAMIC_ENVIRONMENT_URL
        on_stop: stop_review

stop_review:
    stage: deploy
    except:
        - develop
        - master
    script:
        - |
            vercel alias rm "${CI_COMMIT_REF_SLUG}.${CI_PROJECT_NAME}.vercel.app" \
              --token=$VERCEL_TOKEN --yes
        - |
            curl -X DELETE \
                 -u "${SEARCH_USERNAME}:${SEARCH_PASSWORD}" \
                 "${SEARCH_HOST}/${CI_COMMIT_REF_NAME}-grants"
    environment:
        name: review/$CI_COMMIT_REF_NAME
        action: stop
    when: manual
    variables:
        GIT_STRATEGY: none

# --- Decoupled deploys for develop + master (docs/decoupled-build.md) ---
# Vercel's automatic Git deploys for develop/master are disabled in vercel.json
# (git.deploymentEnabled). Instead these jobs run the heavy generate on the GitLab
# runner ONLY when the grants data changed, then fire the branch's Vercel Deploy
# Hook — by which point the S3 freshness marker matches, so Vercel takes its fast
# cached build path.
.deploy_decoupled:
    stage: deploy
    before_script:
        - npm ci --cache .npm --prefer-offline
    script:
        - |
            set -e
            # Compile scripts once, then decide full-vs-cached the same way the build
            # does (committed FIGSHARE_GRANTS_FILE_ID vs the S3 marker for this branch).
            npx tsc --project tsconfig-scripts.json
            if node ./compiled-scripts/scripts/check-grants-freshness.js; then
                echo "Grants data changed — running full generate on GitLab ($ENV_LABEL)"
                # SEARCH_INDEX_PREFIX is set inline so it always wins, targeting the same
                # OpenSearch index this environment reads: master -> grants-v2 (empty
                # prefix), develop -> staging-grants-v2 (prefix "staging").
                SEARCH_INDEX_PREFIX="$SEARCH_INDEX_PREFIX_OVERRIDE" FORCE_UPLOAD=true npm run generate
            else
                echo "Grants data unchanged — skipping generate; Vercel will take the cached path"
            fi
        - |
            set -e
            # Trigger the Vercel deploy. -f makes curl fail the job on an HTTP error so
            # a broken/missing hook URL is surfaced rather than silently swallowed.
            echo "Triggering Vercel deploy hook for $ENV_LABEL"
            curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null
            echo "Deploy hook fired"

deploy_develop:
    extends: .deploy_decoupled
    variables:
        ENV_LABEL: develop
        SEARCH_INDEX_PREFIX_OVERRIDE: staging
        DEPLOY_HOOK_URL: $VERCEL_DEVELOP_DEPLOY_HOOK
    environment:
        name: develop
        url: https://pandemic-pact.vercel.app
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
          when: never
        - if: $CI_COMMIT_BRANCH == "develop"
          when: on_success

deploy_production:
    extends: .deploy_decoupled
    variables:
        ENV_LABEL: production
        SEARCH_INDEX_PREFIX_OVERRIDE: ""
        DEPLOY_HOOK_URL: $VERCEL_PRODUCTION_DEPLOY_HOOK
    environment:
        name: production
        url: https://www.pandemicpact.org
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
          when: never
        - if: $CI_COMMIT_BRANCH == "master"
          when: on_success

# --- Post-deploy smoke checks ---

smoke_review:
    extends: .smoke
    except:
        - develop
        - master
    needs:
        - deploy_review
    variables:
        # `vercel deploy` waits for the build, so the preview is already live and
        # there is no new deployment to wait for.
        SKIP_DEPLOYMENT_WAIT: "true"
    before_script:
        - npm ci --cache .npm --prefer-offline
        # DYNAMIC_ENVIRONMENT_URL arrives from deploy_review's dotenv artifact.
        - export SMOKE_BASE_URL="$DYNAMIC_ENVIRONMENT_URL"

smoke_develop:
    extends: .smoke
    needs:
        - deploy_develop
    variables:
        SMOKE_BASE_URL: https://pandemic-pact.vercel.app
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
          when: never
        - if: $CI_COMMIT_BRANCH == "develop"
          when: on_success

smoke_production:
    extends: .smoke
    needs:
        - deploy_production
    variables:
        SMOKE_BASE_URL: https://www.pandemicpact.org
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
          when: never
        - if: $CI_COMMIT_BRANCH == "master"
          when: on_success
