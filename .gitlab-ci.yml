default:
    image: gitlab.enovate.co.uk:5050/docker-images/php-ci:php8.2-node${NODE_VERSION}

stages:
    - build
    - deploy

fetch_pubmed_data:
    stage: build
    before_script:
        - npm ci --cache .npm --prefer-offline 
    script:
        - npm run fetch-pubmed-data
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "master"
    retry: 2

deploy_review:
    stage: deploy
    except:
        - develop
        - master
    script:
        - npm install --global vercel
        - vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
        - |
            # vercel prints ONLY the deployment URL to stdout; progress and the
            # trailing "To deploy to production…" hint go to stderr. Capture stdout
            # only — the old `2>&1 | tail -1` grabbed that hint instead of the URL,
            # which then made `vercel alias set` fail and marked the whole job failed
            # even though the deploy itself succeeded.
            DEPLOYMENT_URL=$(vercel deploy \
              --build-env "SEARCH_INDEX_PREFIX=$CI_COMMIT_REF_NAME" \
              --build-env "CI_COMMIT_REF_NAME=$CI_COMMIT_REF_NAME" \
              --token=$VERCEL_TOKEN)

            echo "Deployed to: $DEPLOYMENT_URL"

            # A genuine deploy failure (no URL) should still fail the job.
            case "$DEPLOYMENT_URL" in
                https://*) ;;
                *) echo "Deploy did not return a URL — failing."; exit 1 ;;
            esac

            # The friendly per-branch alias is a convenience only; never let it fail
            # the job. Fall back to the unique deployment URL for the environment link.
            ALIAS="${CI_COMMIT_REF_SLUG}.${CI_PROJECT_NAME}.vercel.app"
            if vercel alias set "$DEPLOYMENT_URL" "$ALIAS" --scope=enovatedesign --token=$VERCEL_TOKEN; then
                ENVIRONMENT_URL="https://${ALIAS}"
            else
                echo "Alias step failed; using the deployment URL for the environment link."
                ENVIRONMENT_URL="$DEPLOYMENT_URL"
            fi

            echo "DYNAMIC_ENVIRONMENT_URL=${ENVIRONMENT_URL}" > deploy.env
    artifacts:
        reports:
            dotenv: deploy.env
    environment:
        name: review/$CI_COMMIT_REF_NAME
        url: $DYNAMIC_ENVIRONMENT_URL
        on_stop: stop_review

stop_review:
    stage: deploy
    except:
        - develop
        - master
    script:
        - npm install --global vercel
        - |
            vercel alias rm "${CI_COMMIT_REF_SLUG}.${CI_PROJECT_NAME}.vercel.app" \
              --token=$VERCEL_TOKEN --yes
        - |
            curl -X DELETE \
                 -u "${SEARCH_USERNAME}:${SEARCH_PASSWORD}" \
                 "${SEARCH_HOST}/${CI_COMMIT_REF_NAME}-grants"
    environment:
        name: review/$CI_COMMIT_REF_NAME
        action: stop
    when: manual
    variables:
        GIT_STRATEGY: none